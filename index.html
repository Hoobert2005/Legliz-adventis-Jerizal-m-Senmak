<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>egliseadventistejerusalemdesaintmarc.com — Église Adventiste du 7ème Jour Jérusalem, Saint-Marc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep: #16324F;
    --blue-mid: #2C6E8E;
    --blue-sky: #6FA8C4;
    --gold: #D3A029;
    --gold-soft: #E9C877;
    --green: #3E7A52;
    --ink: #1B2027;
    --paper: #F6F4EE;
    --paper-warm: #EFEADC;
    --line: rgba(22,50,79,0.14);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    line-height: 1.15;
    margin: 0;
    color: var(--blue-deep);
  }
  p{ margin: 0 0 1em; max-width: 62ch; }
  a{ color: inherit; }
  img{ max-width:100%; display:block; }
  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 28px;
  }
  a:focus-visible, button:focus-visible{
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  header{
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(246,244,238,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 28px;
    max-width: 1120px;
    margin: 0 auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .brand-mark{
    width: 46px; height: 46px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 16px;
    color: var(--blue-deep);
    letter-spacing: 0.01em;
  }
  .brand-text small{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--blue-mid);
  }
  nav.links{
    display:flex;
    gap: 28px;
    list-style:none;
    padding:0; margin:0;
  }
  nav.links a{
    text-decoration:none;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    padding: 6px 2px;
    border-bottom: 2px solid transparent;
    transition: border-color .15s ease, color .15s ease;
  }
  nav.links a:hover{ border-color: var(--gold); color: var(--blue-deep); }
  .nav-toggle{
    display:none;
    background:none; border:none; cursor:pointer;
    padding: 6px;
  }
  .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
    content:''; display:block;
    width: 24px; height: 2px; background: var(--blue-deep);
    position: relative;
    transition: transform .2s ease;
  }
  .nav-toggle span::before{ position:absolute; top:-7px; }
  .nav-toggle span::after{ position:absolute; top:7px; }

  .hero{
    position: relative;
    overflow:hidden;
    background: linear-gradient(160deg, var(--blue-deep) 0%, var(--blue-mid) 62%, var(--blue-sky) 100%);
    color: #F4F1E6;
    padding: 96px 0 130px;
  }
  .hero::before{
    content:'';
    position:absolute;
    inset: 0;
    background:
      radial-gradient(circle at 85% 18%, rgba(211,160,41,0.35), transparent 42%),
      radial-gradient(circle at 8% 85%, rgba(62,122,82,0.28), transparent 45%);
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    max-width: 640px;
  }
  .eyebrow{
    font-size: 14.5px;
    font-weight: 500;
    color: var(--gold-soft);
    margin-bottom: 18px;
    opacity: 0;
    animation: rise .7s ease forwards;
    animation-delay: .05s;
  }
  .hero h1{
    color: #FBF8EF;
    font-size: clamp(2.3rem, 5vw, 3.4rem);
    font-weight: 600;
    opacity: 0;
    animation: rise .8s ease forwards;
    animation-delay: .18s;
  }
  .hero p.lead{
    color: #DCE4E8;
    font-size: 18.5px;
    margin-top: 22px;
    max-width: 46ch;
    opacity: 0;
    animation: rise .8s ease forwards;
    animation-delay: .34s;
  }
  .hero-actions{
    margin-top: 34px;
    display:flex;
    gap: 16px;
    flex-wrap: wrap;
    opacity: 0;
    animation: rise .8s ease forwards;
    animation-delay: .5s;
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .btn{
    display:inline-block;
    padding: 13px 26px;
    border-radius: 3px;
    text-decoration:none;
    font-weight: 600;
    font-size: 15px;
    border: 1px solid transparent;
    transition: transform .15s ease, background .15s ease;
  }
  .btn-primary{
    background: var(--gold);
    color: var(--blue-deep);
  }
  .btn-primary:hover{ background: var(--gold-soft); }
  .btn-outline{
    border-color: rgba(244,241,230,0.5);
    color: #F4F1E6;
  }
  .btn-outline:hover{ border-color: #F4F1E6; background: rgba(255,255,255,0.06); }

  .wave{
    position:absolute; bottom:-2px; left:0; width:100%; line-height:0;
  }

  section{ padding: 84px 0; }
  .section-head{
    max-width: 560px;
    margin-bottom: 48px;
  }
  .section-head .tag{
    font-size: 14px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 10px;
    display:block;
  }
  .section-head h2{
    font-size: clamp(1.7rem, 3vw, 2.3rem);
  }

  .welcome{
    background: var(--paper);
  }
  .welcome-grid{
    display:grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 56px;
    align-items:start;
  }
  .verse-block{
    background: var(--blue-deep);
    color: #F1EEE2;
    padding: 36px 34px;
    border-radius: 4px;
    position: relative;
  }
  .verse-block::before{
    content: '"';
    font-family:'Fraunces', serif;
    font-size: 90px;
    color: var(--gold);
    position: absolute;
    top: -6px;
    left: 20px;
    line-height:1;
    opacity: .85;
  }
  .verse-block p{
    font-family:'Fraunces', serif;
    font-size: 20px;
    font-style: italic;
    max-width: none;
    position:relative;
    margin-top: 20px;
  }
  .verse-block span{
    display:block;
    margin-top: 14px;
    font-family:'Work Sans', sans-serif;
    font-style: normal;
    font-size: 14px;
    color: var(--gold-soft);
    font-weight: 600;
  }

  .schedule{
    background: var(--paper-warm);
  }
  .schedule-band{
    display:grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
    background: var(--paper);
  }
  .schedule-item{
    padding: 34px 30px;
    border-left: 1px solid var(--line);
  }
  .schedule-item:first-child{ border-left:none; }
  .schedule-item.highlight{
    background: var(--blue-deep);
    color: #F3F0E4;
  }
  .schedule-item.highlight h3{ color: #F3F0E4; }
  .schedule-item.highlight .time{ color: var(--gold-soft); }
  .schedule-item h3{
    font-size: 17px;
    margin-bottom: 6px;
  }
  .schedule-item .time{
    font-family:'Fraunces', serif;
    font-size: 26px;
    color: var(--blue-mid);
    display:block;
    margin: 8px 0 10px;
  }
  .schedule-item p{ font-size: 14.5px; color: inherit; opacity:.85; margin:0; }

  .departments{ background: var(--paper); }
  .dept-group{ margin-bottom: 44px; }
  .dept-group:last-child{ margin-bottom: 0; }
  .dept-group-title{
    font-size: 13.5px;
    font-weight: 600;
    text-transform: none;
    color: var(--blue-mid);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .dept-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .dept-card{
    background: var(--paper);
    padding: 26px 24px;
    border-top: 3px solid var(--blue-mid);
  }
  .dept-group:nth-child(2) .dept-card{ border-top-color: var(--gold); }
  .dept-group:nth-child(3) .dept-card{ border-top-color: var(--green); }
  .dept-group:nth-child(4) .dept-card{ border-top-color: var(--blue-deep); }
  .dept-card h3{
    font-size: 16.5px;
    margin-bottom: 7px;
  }
  .dept-card p{
    font-size: 14px;
    color: #4A5561;
    margin:0;
  }

  .events{ background: var(--paper-warm); }
  .event-row{
    display:flex;
    gap: 26px;
    padding: 24px 0;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
  }
  .event-row:first-of-type{ border-top: 1px solid var(--line); }
  .event-date{
    font-family:'Fraunces', serif;
    color: var(--blue-deep);
    font-weight: 600;
    font-size: 16px;
    min-width: 130px;
    flex-shrink:0;
  }
  .event-body h3{
    font-size: 17px;
    margin-bottom: 4px;
  }
  .event-body p{ font-size:14.5px; color:#4A5561; margin:0; max-width: 56ch; }

  .giving{
    background: var(--blue-deep);
    color: #F1EEE2;
  }
  .giving .wrap{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 50px;
    align-items:center;
  }
  .giving h2{ color: #FBF8EF; }
  .giving p{ color: #D9DFE2; }
  .giving-box{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 4px;
    padding: 28px;
  }
  .giving-box h3{ color: var(--gold-soft); font-size:16px; margin-bottom: 12px; }
  .giving-box ul{ margin:0; padding-left: 18px; color:#D9DFE2; font-size:14.5px; }
  .giving-box li{ margin-bottom: 8px; }

  .contact{ background: var(--paper); }
  .contact-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
  }
  .contact-info dt{
    font-weight: 600;
    color: var(--blue-deep);
    font-size: 14.5px;
    margin-top: 20px;
  }
  .contact-info dt:first-child{ margin-top:0; }
  .contact-info dd{
    margin: 4px 0 0;
    color: #3D454E;
    font-size: 15.5px;
  }
  .map-plate{
    background: var(--paper-warm);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 280px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 30px;
    color: #6B7580;
    font-size: 14.5px;
  }

  footer{
    background: var(--blue-deep);
    color: #C9D2D6;
    padding: 44px 0 30px;
    font-size: 14px;
  }
  .foot-grid{
    display:flex;
    justify-content: space-between;
    flex-wrap:wrap;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 20px;
  }
  footer .brand-text{ color:#F1EEE2; }
  footer a{ text-decoration:none; color:#C9D2D6; }
  footer a:hover{ color: var(--gold-soft); }
  .foot-links{ display:flex; gap: 26px; list-style:none; padding:0; margin:0; }

  @media (max-width: 900px){
    .welcome-grid, .contact-grid, .giving .wrap{ grid-template-columns: 1fr; }
    .dept-grid{ grid-template-columns: repeat(2, 1fr); }
    .dept-group:nth-child(2) .dept-card{ border-top-color: var(--gold); }
    .schedule-band{ grid-template-columns: 1fr; }
    .schedule-item{ border-left:none; border-top: 1px solid var(--line); }
    .schedule-item:first-child{ border-top:none; }
  }
  @media (max-width: 680px){
    nav.links{
      position:absolute;
      top: 100%; left:0; right:0;
      background: var(--paper);
      flex-direction: column;
      padding: 18px 28px 26px;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      display:none;
    }
    nav.links.open{ display:flex; }
    .nav-toggle{ display:block; }
    .dept-grid{ grid-template-columns: 1fr; }
    .hero{ padding: 70px 0 100px; }
    section{ padding: 60px 0; }
    .event-row{ flex-direction: column; gap: 6px; }
  }
</style>
</head>
